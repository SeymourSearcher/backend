[pytest]
testpaths = tests
# So `pytest` works as well as `python -m pytest`; only the latter puts the
# project root on sys.path by itself.
pythonpath = .
asyncio_mode = auto
# Both scopes must match: a session-scoped engine built on one loop cannot serve
# tests running on another ("attached to a different loop").
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers
markers =
    integration: needs TEST_DATABASE_URL pointing at a throwaway MySQL
